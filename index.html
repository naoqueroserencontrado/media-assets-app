<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Mídia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Adicionar Nova Mídia</h1>
    <nav>
      <a href="index.html">Galeria</a>
      <a href="upload.html" class="active">Adicionar Mídia</a>
    </nav>
  </header>

  <main class="container">
    <form id="upload-form" class="form-card">
      <div class="form-group">
        <label for="title">Título da Mídia</label>
        <input type="text" id="title" required placeholder="Ex: Vídeo de demonstração">
      </div>

      <div class="form-group">
        <label for="media-type">Tipo de Mídia</label>
        <select id="media-type" required>
          <option value="image">Imagem / GIF</option>
          <option value="video">Vídeo</option>
        </select>
      </div>

      <div class="form-group">
        <label for="source-type">Origem do Conteúdo</label>
        <select id="source-type" required>
          <option value="url">Link Externo (URL)</option>
          <option value="drive">Arquivo Local (Enviar para o Google Drive)</option>
        </select>
      </div>

      <!-- Campo para URL externa -->
      <div class="form-group" id="url-input-group">
        <label for="media-url">URL da Mídia</label>
        <input type="url" id="media-url" placeholder="https://exemplo.com/imagem.png ou embed de vídeo">
      </div>

      <!-- Campo para arquivo local (Google Drive) -->
      <div class="form-group hidden" id="file-input-group">
        <label for="media-file">Selecione o Arquivo</label>
        <input type="file" id="media-file" accept="image/*,video/*">
        <p class="help-text">O envio ao Google Drive será configurado em breve.</p>
      </div>

      <button type="submit" class="btn-submit">Salvar e Visualizar</button>
    </form>
  </main>

  <script src="js/upload.js"></script>
</body>
</html>
